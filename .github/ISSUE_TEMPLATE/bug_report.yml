name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please check the [known limitations](../blob/main/docs/known-limitations.md) first. Do not paste private conversation content; made-up text that reproduces the problem is enough.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Select … 2. Press ⌘⇧E … 3. …"
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin version
      placeholder: "0.2.2"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Hermes version (`hermes --version`) and OS
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs (optional)
      description: Error toasts, or lines from the app's developer console mentioning diple. Remove any personal paths.
